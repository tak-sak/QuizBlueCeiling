<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Result - Quiz Blue Ceiling</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <div class="quiz-card mx-auto shadow-lg">

        <h2 class="text-center mb-4 border-bottom pb-2">QUIZ RESULT</h2>

        <div class="d-flex align-items-start mb-4">
            <div class="text-center me-3">
                <img th:src="@{/images/host.jpg}" alt="Host" class="char-img-small">
                <div class="small fw-bold">HOST</div>
            </div>
            <div class="bubble bubble-left flex-grow-1 d-flex flex-column justify-content-center text-center">
                <p class="mb-1 small">お疲れ様でした！今回の結果は…</p>
                <h3 class="mb-0 text-primary">
                    <span class="fs-1 fw-bold" th:text="${score}">0</span> 点です！
                </h3>
            </div>
        </div>

        <div class="d-flex align-items-start flex-row-reverse">
            <div class="text-center ms-3">
                <img th:src="@{/images/player.jpg}" alt="Player" class="char-img-small">
                <div class="small fw-bold">PLAYER</div>
            </div>

            <div class="bubble bubble-right flex-grow-1">
                <div class="d-grid gap-2 w-100">
                    <p class="small text-muted mb-2 text-center">どうする？</p>
                    <a th:href="@{/start}" class="btn btn-answer text-center py-2">もう一度挑戦する</a>
                    <a th:href="@{/}" class="btn btn-outline-secondary btn-sm text-center">タイトルに戻る</a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
