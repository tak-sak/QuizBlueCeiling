<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quiz Blue Ceiling - Opening</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <div class="quiz-card mx-auto shadow-lg text-center">
        <div class="mb-4">
            <img th:src="@{/images/logo.png}" alt="Quiz Logo" class="logo-img-adjust">
        </div>

        <div class="d-flex justify-content-center align-items-center mb-4 gap-4">
            <div class="text-center">
                <img th:src="@{/images/host.jpg}" class="char-img-small mb-1">
                <div class="small fw-bold">HOST</div>
            </div>
            <div class="fw-bold fs-4 text-primary">VS</div>
            <div class="text-center">
                <img th:src="@{/images/player.jpg}" class="char-img-small mb-1">
                <div class="small fw-bold">PLAYER</div>
            </div>
        </div>

        <div class="d-grid gap-2 col-8 mx-auto">
            <a href="/start" class="btn btn-answer text-center py-3 fs-4 fw-bold shadow-sm">
                START
            </a>
            <p class="text-muted small mt-2">間違えたら即終了のクイズバトル</p>
        </div>
    </div>
</div>

</body>
</html>
