<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quiz Blue Ceiling</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div id="effect-overlay">
    <img id="result-image" src="" alt="result">
</div>

<div class="container">
    <div class="quiz-card mx-auto shadow-lg">

        <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
            <span class="badge bg-warning text-dark fs-6" th:text="'Score: ' + ${session.score}">Score: 0</span>
            <span class="text-muted fw-bold" th:text="'第' + (${currentIndex} + 1) + '問'">第1問</span>
        </div>

        <div class="d-flex align-items-start mb-4">
            <div class="text-center me-3">
                <img th:src="@{/images/host.jpg}" alt="Host" class="char-img-small">
                <div class="small fw-bold">HOST</div>
            </div>
            <div class="bubble bubble-left flex-grow-1">
                <h5 class="mb-0" th:text="${quiz.questionText}">問題文がここに入ります。</h5>
            </div>
        </div>

        <div class="d-flex align-items-start flex-row-reverse">
            <div class="text-center ms-3">
                <img th:src="@{/images/player.jpg}" alt="Player" class="char-img-small">
                <div class="small fw-bold">PLAYER</div>
            </div>

            <div class="bubble bubble-right flex-grow-1">
                <form id="quiz-form" th:action="@{/answer}" method="post" class="d-grid gap-2">
                    <input type="hidden" name="id" th:value="${quiz.id}">
                    <input type="hidden" name="currentIndex" th:value="${currentIndex}">

                    <button type="submit" name="choice" value="1" class="btn btn-answer text-start" th:text="'1. ' + ${quiz.choice1}"></button>
                    <button type="submit" name="choice" value="2" class="btn btn-answer text-start" th:text="'2. ' + ${quiz.choice2}"></button>
                    <button type="submit" name="choice" value="3" class="btn btn-answer text-start" th:text="'3. ' + ${quiz.choice3}"></button>
                    <button type="submit" name="choice" value="4" class="btn btn-answer text-start" th:text="'4. ' + ${quiz.choice4}"></button>
                </form>
            </div>
        </div>

    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
